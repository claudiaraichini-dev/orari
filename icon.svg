<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- fondo crema a tutto campo (va bene anche per icone ritagliate a cerchio) -->
  <rect width="512" height="512" fill="#FBF6EA"/>
  <!-- alone caldo -->
  <circle cx="256" cy="262" r="196" fill="#FCE6C2"/>

  <!-- foglio del calendario -->
  <path d="M140 174 Q 256 164 372 171 Q 381 278 376 384 Q 256 393 135 385 Q 129 280 140 174 Z" fill="#FFFDF7"/>
  <!-- testata azzurra -->
  <path d="M140 174 Q 256 164 372 171 L 374 232 Q 256 239 137 232 Z" fill="#4F8FCB"/>
  <!-- contorno disegnato -->
  <path d="M140 174 Q 256 164 372 171 Q 381 278 376 384 Q 256 393 135 385 Q 129 280 140 174 Z" fill="none" stroke="#2C3A4A" stroke-width="11" stroke-linejoin="round"/>
  <path d="M138 233 Q 256 240 375 232" fill="none" stroke="#2C3A4A" stroke-width="9" stroke-linecap="round"/>

  <!-- anelli -->
  <path d="M200 146 L 201 196" stroke="#2C3A4A" stroke-width="15" stroke-linecap="round"/>
  <path d="M312 145 L 311 195" stroke="#2C3A4A" stroke-width="15" stroke-linecap="round"/>

  <!-- fasce della giornata: mattina, pomeriggio, sera -->
  <g stroke="#2C3A4A" stroke-width="6">
    <rect x="166" y="260" width="52" height="24" rx="12" fill="#F2A33A"/>
    <rect x="230" y="259" width="52" height="24" rx="12" fill="#F2A33A"/>
    <rect x="294" y="261" width="52" height="24" rx="12" fill="#ECE4D2"/>
    <rect x="167" y="304" width="52" height="24" rx="12" fill="#ECE4D2"/>
    <rect x="231" y="305" width="52" height="24" rx="12" fill="#F2A33A"/>
    <rect x="166" y="348" width="52" height="24" rx="12" fill="#F2A33A"/>
  </g>

  <!-- cuore -->
  <g transform="translate(330 342) rotate(-8) scale(0.95)">
    <path d="M0 40 C -30 20, -58 -2, -52 -30 C -46 -54, -15 -57, 0 -33 C 15 -57, 46 -54, 52 -30 C 58 -2, 30 20, 0 40 Z" fill="#E0806A" stroke="#2C3A4A" stroke-width="10" stroke-linejoin="round"/>
    <path d="M-34 -28 Q -30 -40 -18 -40" fill="none" stroke="#FFFDF7" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
